name: MJ tool qualification
on:
  push:
    branches: [wbs/MJ-tool-probe]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ea71286dd96c227166a442a0d9f8f89390d7c739
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
        with:
          version: 2026.11.14
          install_args: --locked
          cache: false
      - name: Resolve project tools and check every recipe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          mise lock --check
          $env:PATH = ((mise bin-paths) -join [IO.Path]::PathSeparator) + [IO.Path]::PathSeparator + $env:PATH
          just --version
          just --list
          $recipes = (just --summary).Trim().Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          foreach ($recipe in $recipes) { just --dry-run $recipe }
      - uses: Swatinem/rust-cache@v2.9.3
        if: runner.os == 'Windows'
        with:
          save-if: 'false'
      - name: Run just check in PowerShell
        if: runner.os == 'Windows'
        run: mise exec -- just check
