name: Privileged product regression
on:
  schedule:
    - cron: '27 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/cores.toml'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.config/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - '.config/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/privileged.yml'

permissions:
  contents: read

jobs:
  installed-product:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suite: recovery
          - os: macos-latest
            suite: recovery
          - os: windows-latest
            suite: recovery
          - os: windows-latest
            suite: preflight
          - os: windows-latest
            suite: program
          - os: windows-latest
            suite: clean
          - os: windows-latest
            suite: stop
          - os: ubuntu-latest
            suite: takeover
          - os: macos-latest
            suite: takeover
          - os: windows-latest
            suite: takeover
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
      ETD_G2_CI: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux libraries and network inspection tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libssl-dev mold nftables iproute2
          sudo systemctl start systemd-resolved
      - name: Install pinned protoc
        shell: pwsh
        run: ./.github/scripts/setup-protoc.ps1
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - run: python -m pip install psutil==7.0.0
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - name: Allow for three Windows service generations and native cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'

          [[profile.privileged.overrides]]
          filter = 'test(=installed_kernel_and_host_crash_recovery) | test(=installed_network_uninstall_restores_machine) | test(=service_stop_with_a_running_network_is_bounded)'
          slow-timeout = { period = "120s", terminate-after = 15 }
          '@ | Add-Content -LiteralPath .config/nextest.toml
      - name: Allow for the takeover generations and native cleanup
        if: matrix.suite == 'takeover'
        shell: bash
        run: |
          cat >> .config/nextest.toml <<'EOF'

          [[profile.privileged.overrides]]
          filter = 'test(/^takeover_/)'
          slow-timeout = { period = "120s", terminate-after = 20 }
          EOF
      # Qualify the native probes independently of the packaged host.
      - name: Qualify independent Windows inventory
        if: runner.os == 'Windows' && matrix.suite == 'recovery'
        env:
          ETD_G2_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo nextest run --locked --profile privileged --run-ignored only -p etd-testkit --test tier3 -E 'test(=independent_inventory_detects_native_foreign_objects)' --success-output immediate
      - name: Fetch the verified release kernel beside the host image
        run: cargo xtask fetch-cores --target host --bundle target/debug/cores --github-env ETD_G2_CORE
      - name: Build the host with the committed release hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked -p etd-host -p etd-ctl
          $digest = (Get-FileHash -LiteralPath $env:ETD_G2_CORE -Algorithm SHA256).Hash.ToLowerInvariant()
          "ETD_G2_BIN=$env:GITHUB_WORKSPACE/target/debug" >> $env:GITHUB_ENV
          "ETD_G2_SHA=$digest" >> $env:GITHUB_ENV
          "ETD_G2_PYTHON=$((Get-Command python -CommandType Application | Select-Object -First 1).Source)" >> $env:GITHUB_ENV
      - name: Compile runner as the build user
        run: cargo nextest list --locked --profile privileged --run-ignored only -p etd-testkit --test tier3
      - name: Installed service tests (administrator)
        if: runner.os == 'Windows' && matrix.suite == 'recovery'
        run: cargo nextest run --locked --profile privileged --run-ignored only -p etd-testkit --test tier3 -E 'test(=installed_kernel_and_host_crash_recovery)' --success-output immediate
      - name: Service STOP with a running network (administrator)
        if: matrix.suite == 'stop'
        run: cargo nextest run --locked --profile privileged --run-ignored only -p etd-testkit --test tier3 -E 'test(=service_stop_with_a_running_network_is_bounded)' --success-output immediate
      - name: Pre-existing shared drivers (fresh administrator runner)
        if: matrix.suite == 'preflight'
        run: cargo nextest run --locked --profile privileged --run-ignored only -p etd-testkit --test tier3 -E 'test(=preexisting_shared_drivers_are_conflicts) | test(=preexisting_shared_drivers_survive_uninstall)' --success-output immediate
      - name: Complete install and uninstall (fresh administrator runner)
        if: matrix.suite == 'clean'
        run: cargo nextest run --locked --profile privileged --run-ignored only -p etd-testkit --test tier3 -E 'test(=installed_network_uninstall_restores_machine)' --success-output immediate
      - name: Pre-existing inactive program rule (fresh administrator runner)
        if: matrix.suite == 'program'
        run: cargo nextest run --locked --profile privileged --run-ignored only -p etd-testkit --test tier3 -E 'test(=preexisting_program_rule_blocks_start)' --success-output immediate
      - name: Management port takeover (administrator)
        if: runner.os == 'Windows' && matrix.suite == 'takeover'
        run: cargo nextest run --locked --profile privileged --run-ignored only -p etd-testkit --test tier3 -E 'test(/^takeover_/)' --success-output immediate
      - name: Installed service tests (root)
        if: runner.os != 'Windows'
        shell: bash
        env:
          ETD_G2_FILTER: ${{ matrix.suite == 'takeover' && 'test(/^takeover_/)' || 'not test(/^takeover_/)' }}
        run: |
          cargo nextest archive --locked -p etd-testkit --test tier3 --archive-file "$RUNNER_TEMP/tier3.tar.zst"
          sudo env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "RUNNER_TEMP=$RUNNER_TEMP" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            "ETD_G2_CI=$ETD_G2_CI" "GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            "ETD_G2_PYTHON=$ETD_G2_PYTHON" "ETD_G2_BIN=$ETD_G2_BIN" "ETD_G2_SHA=$ETD_G2_SHA" \
            "$(command -v cargo-nextest)" nextest run --profile privileged --run-ignored only --archive-file "$RUNNER_TEMP/tier3.tar.zst" --workspace-remap "$GITHUB_WORKSPACE" -E "$ETD_G2_FILTER" --no-fail-fast --success-output immediate
