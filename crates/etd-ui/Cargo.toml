[package]
name = "etd-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
etd-app = { workspace = true }
etd-client = { workspace = true }
etd-contract = { workspace = true }
etd-ipc = { workspace = true }
etd-sysfx-os = { workspace = true }
anyhow = { workspace = true }
async-channel = { workspace = true }
async-trait = { workspace = true }
gpui-kit = { workspace = true, features = ["component", "assets", "x11", "gpui-fast"] }
jiff = { workspace = true, features = ["std"] }
muda = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt", "std"] }
tray-icon = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { workspace = true, features = ["ksni"] }
muda = { workspace = true, features = ["snapshot"] }

[dev-dependencies]
etd-testkit = { workspace = true }
gpui-kit = { workspace = true, features = ["component", "assets", "x11", "gpui-fast", "test-support"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }

[lints]
workspace = true
