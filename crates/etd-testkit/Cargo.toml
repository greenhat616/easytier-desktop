[package]
name = "etd-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
etd-app = { workspace = true }
etd-client = { workspace = true }
etd-contract = { workspace = true }
etd-core-api = { workspace = true }
etd-host-core = { workspace = true }
etd-ipc = { workspace = true }
etd-proc = { workspace = true }
etd-sysfx = { workspace = true }
etd-sysfx-os = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
jiff = { workspace = true, features = ["std", "serde"] }
proptest = { workspace = true }
prost = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-stream = { workspace = true, features = ["net", "sync"] }
tonic = { workspace = true, features = ["channel", "codegen", "router", "server"] }
tonic-prost = { workspace = true }
tracing = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["std", "v4"] }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
mockall = { workspace = true }
predicates = { workspace = true }

[lints]
workspace = true
