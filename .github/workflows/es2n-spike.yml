# Throwaway ES2N step-0 spike (doc#17); removed before the branch is merged.
name: ES2N spike
on:
  push:
    branches: [wbs/ES2N-native]
    paths:
      - 'spike/**'
      - '.github/workflows/es2n-spike.yml'

permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned protoc
        shell: pwsh
        run: ./.github/scripts/setup-protoc.ps1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - name: Build the spike and the captured tests
        run: |
          cargo build --manifest-path spike/es2n-wmi/Cargo.toml
          cargo xtask fetch-cores --target host --bundle target/debug/cores
          cargo nextest list --locked --profile privileged -p etd-host --run-ignored only --test install_roundtrip
          cargo nextest list --locked --profile privileged -p etd-sysfx-os --run-ignored only --test windows_fence
      - name: Fetch Process Monitor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path C:\pm | Out-Null
          Invoke-WebRequest https://download.sysinternals.com/files/ProcessMonitor.zip -OutFile C:\pm\pm.zip
          Expand-Archive C:\pm\pm.zip -DestinationPath C:\pm
          Get-AuthenticodeSignature C:\pm\Procmon64.exe | Format-List Status, SignerCertificate | Out-String | Write-Host
      - name: Native paths under HKCU plants, captured
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $a = 'etd-es2n-a''q\b"c'
          $b = 'etd-es2n-b'
          foreach ($id in $a, $b) {
            New-NetFirewallRule -Name $id -DisplayName 'etd-es2n-dup' -Group 'etd-es2n' -Direction Inbound -Program 'C:\etd-es2n\core.exe' -Action Allow | Out-Null
          }
          $count = @(Get-NetFirewallRule -PolicyStore PersistentStore).Count
          $env:ETD_SPIKE_A = $a
          $env:ETD_SPIKE_B = $b
          $code = 0
          Start-Process C:\pm\Procmon64.exe -ArgumentList '/AcceptEula','/Quiet','/Minimized','/BackingFile','C:\pm\cap.pml'
          Start-Sleep -Seconds 10
          try {
            foreach ($mode in 'fwapi', 'natives') {
              & spike/es2n-wmi/target/debug/es2n-wmi-spike.exe $count $mode
              if ($LASTEXITCODE -ne 0) { $code = 1 }
            }
            Write-Host "PowerShell view afterwards:"
            foreach ($id in $a, $b) {
              $found = @(Get-NetFirewallRule -PolicyStore PersistentStore -Name $id -ErrorAction SilentlyContinue).Count
              $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $id -ErrorAction SilentlyContinue).Count
              Write-Host "$id persistent=$found active=$active"
              if ($id -eq $a -and ($found -ne 0 -or $active -ne 0)) { $code = 1 }
              if ($id -eq $b -and ($found -ne 1 -or $active -ne 1)) { $code = 1 }
            }
            cargo nextest run --locked --profile privileged -p etd-host --run-ignored only --test install_roundtrip --success-output never
            if ($LASTEXITCODE -ne 0) { Write-Host 'install_roundtrip failed'; $code = 1 }
            cargo nextest run --locked --profile privileged -p etd-sysfx-os --run-ignored only --test windows_fence -E 'test(session_fence)' --success-output never
            if ($LASTEXITCODE -ne 0) { Write-Host 'session_fence failed'; $code = 1 }
          } finally {
            Remove-NetFirewallRule -Name $a, $b -ErrorAction SilentlyContinue
            & C:\pm\Procmon64.exe /AcceptEula /Terminate
            Start-Sleep -Seconds 5
          }
          & C:\pm\Procmon64.exe /AcceptEula /Quiet /OpenLog C:\pm\cap.pml /SaveAs C:\pm\cap.csv
          for ($i = 0; $i -lt 60 -and !(Test-Path C:\pm\cap.csv); $i++) { Start-Sleep -Seconds 5 }
          Start-Sleep -Seconds 10
          $rows = Import-Csv C:\pm\cap.csv
          Write-Host "captured events: $($rows.Count)"
          $ours = $rows | Where-Object { $_.'Process Name' -match '^(es2n-wmi-spike|etd-host|install_roundtrip-[0-9a-f]+|windows_fence-[0-9a-f]+)\.exe$' }
          $ours | Group-Object 'Process Name' | ForEach-Object { Write-Host "$($_.Name): $($_.Count) events" }
          $classes = $ours | Where-Object { $_.Operation -like 'Reg*' -and $_.Path -match '^(HKCR|HKCU\\Software\\Classes|HKU\\[^\\]+_Classes)' }
          Write-Host "HKCR/HKCU classes registry events by our processes: $(@($classes).Count)"
          $classes | Group-Object 'Process Name' | ForEach-Object { Write-Host "  $($_.Name): $($_.Count)" }
          $classes | Select-Object -First 80 'Process Name', PID, Operation, Path, Result | Format-Table -AutoSize | Out-String -Width 400 | Write-Host
          $classes | Export-Csv C:\pm\classes.csv -NoTypeInformation
          $loads = $ours | Where-Object { $_.Operation -eq 'Load Image' } | Group-Object 'Process Name', Path | ForEach-Object { $_.Name }
          $loads | Out-File C:\pm\loads.txt
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: es2n-procmon
          path: |
            C:\pm\classes.csv
            C:\pm\loads.txt
