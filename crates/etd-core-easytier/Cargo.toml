[package]
name = "etd-core-easytier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
etd-contract = { workspace = true }
etd-core-api = { workspace = true }
etd-proc = { workspace = true }
etd-sysfx = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
jiff = { workspace = true, features = ["std", "serde"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true }
uuid = { workspace = true, features = ["std", "v5"] }
# Features of these two are owned by E2 (doc#5: api / management-rpc).
easytier-proto = { workspace = true, features = ["api"] }
easytier-core = { workspace = true, features = ["management-rpc"] }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
