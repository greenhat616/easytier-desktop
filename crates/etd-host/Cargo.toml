[package]
name = "etd-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Composition root: wires real implementations; never calls OS APIs itself.
[dependencies]
etd-contract = { workspace = true }
etd-core-api = { workspace = true }
etd-core-easytier = { workspace = true }
etd-host-core = { workspace = true }
etd-ipc = { workspace = true }
etd-proc = { workspace = true }
etd-sysfx = { workspace = true }
etd-sysfx-os = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "error-context", "help", "std", "usage"] }
async-trait = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
rand = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tonic = { workspace = true, features = ["transport", "router"] }
uuid = { workspace = true, features = ["v4", "std"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true, features = ["std"] }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "std"] }

[dev-dependencies]
assert_cmd = { workspace = true }
etd-client = { workspace = true }
etd-sysfx-os = { workspace = true, features = ["ci-test-fixtures"] }
etd-testkit = { workspace = true }
predicates = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
