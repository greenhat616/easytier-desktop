# ES5 development only (topic#51 msg#2183): the tier-three session cases on
# fresh Windows runners, set up like privileged.yml's Windows jobs. Removed
# before delivery; the cases then run from privileged.yml (etd-g2's file).
name: ES5 session cases (development)
on:
  push:
    branches: [wbs/ES5-accept]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: es5-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session:
    strategy:
      fail-fast: false
      matrix:
        case: [session_host_crash_recovery_and_purge, session_and_service_exclude_each_other]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
      ETD_G2_CI: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          tools: protoc cargo-nextest python
      - name: Set up the tier-three Python interpreter
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $python = mise which python
          & $python -m pip install psutil==7.0.0
          "ETD_G2_PYTHON=$python" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: false
      - name: Allow for the session generations and native cleanup
        shell: pwsh
        run: |
          @'

          [[profile.privileged.overrides]]
          filter = 'test(/^session_/)'
          slow-timeout = { period = "120s", terminate-after = 15 }
          '@ | Add-Content -LiteralPath .config/nextest.toml
      - name: Fetch the verified release kernel beside the host image
        run: cargo xtask fetch-cores --target host --bundle target/debug/cores --github-env ETD_G2_CORE
      - name: Build the host with the committed release hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked -p etd-host -p etd-ctl
          $digest = (Get-FileHash -LiteralPath $env:ETD_G2_CORE -Algorithm SHA256).Hash.ToLowerInvariant()
          "ETD_G2_BIN=$env:GITHUB_WORKSPACE/target/debug" >> $env:GITHUB_ENV
          "ETD_G2_SHA=$digest" >> $env:GITHUB_ENV
      - name: Compile runner
        run: cargo nextest list --locked --profile privileged --run-ignored only -p etd-testkit --test tier3
      - name: Session case (administrator)
        run: cargo nextest run --locked --profile privileged --run-ignored only -p etd-testkit --test tier3 -E 'test(=${{ matrix.case }})' --success-output immediate
