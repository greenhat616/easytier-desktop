name: Privileged product regression
on:
  push:
    branches: [wbs/G2-fixture-control]
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      matrix:
        group: [idle, fixture]
      fail-fast: false
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      ETD_G2_CI: '1'
      GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psutil==7.0.0
      - run: python -Bu crates/etd-testkit/tests/tier3/fixture_control.py
