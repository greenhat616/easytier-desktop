# Throwaway ES2N step-0 spike (doc#17); removed before the branch is merged.
name: ES2N spike
on:
  push:
    branches: [wbs/ES2N-native]
    paths:
      - 'spike/**'
      - '.github/workflows/es2n-spike.yml'

permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned protoc
        shell: pwsh
        run: ./.github/scripts/setup-protoc.ps1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - name: Build the spikes and the captured tests
        run: |
          cargo build --manifest-path spike/es2n-native/Cargo.toml
          cargo xtask fetch-cores --target host --bundle target/debug/cores
          cargo nextest list --locked --profile privileged -p etd-host --run-ignored only --test install_roundtrip
          cargo nextest list --locked --profile privileged -p etd-sysfx-os --run-ignored only --test windows_fence
      - name: Fetch Process Monitor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path C:\pm | Out-Null
          Invoke-WebRequest https://download.sysinternals.com/files/ProcessMonitor.zip -OutFile C:\pm\pm.zip
          Expand-Archive C:\pm\pm.zip -DestinationPath C:\pm
          (Get-AuthenticodeSignature C:\pm\Procmon64.exe).Status
      - name: Plant script
        shell: pwsh
        run: |
          @'
          param([switch]$Remove)
          $classes = 'HKCU:\Software\Classes'
          $bogus = '{E7D0E5A1-2B4C-4F6D-9E8A-0123456789AB}'
          $dir = 'C:\etd-es2n-spike-planted'
          $iids = '{9556DC99-828C-11CF-A37E-00AA003240C7}','{027947E1-D731-11CE-A357-000000000001}','{DC12A681-737F-11CF-884D-00AA004B2E24}','{44ACA674-E8FC-11D0-A07C-00C04FB68820}','{44ACA675-E8FC-11D0-A07C-00C04FB68820}','{F309AD18-D86A-11D0-A075-00C04FB68820}'
          $proxies = @($iids | ForEach-Object { (Get-ItemProperty "HKLM:\SOFTWARE\Classes\Interface\$_\ProxyStubClsid32" -ErrorAction SilentlyContinue).'(default)' } | Where-Object { $_ } | Sort-Object -Unique)
          $clsids = @{ locator='{4590F811-1D3A-11D0-891F-00AA004B2E24}'; context='{674B6698-EE92-11D0-AD71-00C04FD8FDFF}'; fwpolicy='{E2B3C97F-6AE1-41AC-817A-F6F92166D7DD}'; bogus=$bogus }
          for ($i = 0; $i -lt $proxies.Count; $i++) { $clsids["proxy$i"] = $proxies[$i] }
          if ($Remove) {
            foreach ($c in $clsids.Values) { Remove-Item "$classes\CLSID\$c" -Recurse -Force -ErrorAction SilentlyContinue }
            foreach ($i in $iids) { Remove-Item "$classes\Interface\$i" -Recurse -Force -ErrorAction SilentlyContinue }
            Write-Host 'unplanted'
            return
          }
          foreach ($label in $clsids.Keys) {
            $c = $clsids[$label]
            if (Test-Path "$classes\CLSID\$c") { throw "HKCU already has $c" }
            $k = New-Item "$classes\CLSID\$c\InprocServer32" -Force
            Set-ItemProperty $k.PSPath '(default)' "$dir\$label.dll"
            Set-ItemProperty $k.PSPath 'ThreadingModel' 'Both'
            if ($label -ne 'bogus') {
              Set-ItemProperty (New-Item "$classes\CLSID\$c\TreatAs" -Force).PSPath '(default)' $bogus
              Set-ItemProperty (New-Item "$classes\CLSID\$c\AutoTreatAs" -Force).PSPath '(default)' $bogus
            }
          }
          foreach ($i in $iids) { Set-ItemProperty (New-Item "$classes\Interface\$i\ProxyStubClsid32" -Force).PSPath '(default)' $bogus }
          Write-Host "planted: $($clsids.Count) classes ($($proxies -join ', ') as proxies), $($iids.Count) interfaces"
          '@ | Set-Content C:\pm\plant.ps1
      - name: Capture helpers
        shell: pwsh
        run: |
          @'
          param([string]$Name, [string]$Processes)
          & C:\pm\Procmon64.exe /AcceptEula /Terminate
          Start-Sleep -Seconds 5
          Start-Process C:\pm\Procmon64.exe -ArgumentList '/AcceptEula','/Quiet','/OpenLog',"C:\pm\$Name.pml",'/SaveAs',"C:\pm\$Name.csv" -Wait
          $rows = Import-Csv "C:\pm\$Name.csv"
          Write-Host "[$Name] captured events: $($rows.Count)"
          $ours = @($rows | Where-Object { $_.'Process Name' -match $Processes })
          $ours | Group-Object 'Process Name' | ForEach-Object { Write-Host "[$Name] $($_.Name): $($_.Count) events" }
          $classes = @($ours | Where-Object { $_.Operation -like 'Reg*' -and $_.Path -match '^(HKCR|HKCU\Software\Classes|HKU\[^\]+_Classes)' })
          Write-Host "[$Name] HKCR/HKCU classes registry events by our processes: $($classes.Count)"
          $classes | Group-Object 'Process Name', Operation, Path, Result | Sort-Object Count -Descending | ForEach-Object { Write-Host ("  {0,5}  {1}" -f $_.Count, $_.Name) }
          $classes | Export-Csv "C:\pm\$Name-classes.csv" -NoTypeInformation
          $loads = @($ours | Where-Object { $_.Operation -eq 'Load Image' } | ForEach-Object { "$($_.'Time of Day') $($_.'Process Name') $($_.PID) $($_.Path)" })
          $loads | Out-File "C:\pm\$Name-loads.txt"
          Write-Host "[$Name] image loads by our processes: $($loads.Count) (combase/oleaut32/ole32/shell32 below)"
          $loads | Where-Object { $_ -match '(combase|oleaut32|ole32|shell32|windows\.storage|FirewallAPI)\.dll' } | Write-Host
          Remove-Item "C:\pm\$Name.csv"
          '@ | Set-Content C:\pm\analyze.ps1
      - name: Native paths under HKCU plants, captured
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $a = 'etd-es2n-a''q\b"c'
          $b = 'etd-es2n-b'
          foreach ($id in $a, $b) {
            New-NetFirewallRule -Name $id -DisplayName 'etd-es2n-dup' -Group 'etd-es2n' -Direction Inbound -Program 'C:\etd-es2n\core.exe' -Action Allow | Out-Null
          }
          $count = @(Get-NetFirewallRule -PolicyStore PersistentStore).Count
          $env:ETD_SPIKE_A = $a
          $env:ETD_SPIKE_B = $b
          $code = 0
          & C:\pm\plant.ps1
          Start-Process C:\pm\Procmon64.exe -ArgumentList '/AcceptEula','/Quiet','/Minimized','/BackingFile','C:\pm\native.pml'
          Start-Sleep -Seconds 10
          try {
            $env:ETD_SPIKE_FREE = 'byhandle'
            & spike/es2n-native/target/debug/es2n-native-spike.exe $count fwapi
            Write-Host "exit (2.27, FWFreeFirewallRulesByHandle): $LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { $code = 1 }
            Remove-Item Env:ETD_SPIKE_FREE
            & spike/es2n-native/target/debug/es2n-native-spike.exe $count natives
            Write-Host "exit (natives): $LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { $code = 1 }
          } finally {
            & C:\pm\analyze.ps1 -Name native -Processes '^es2n-native-spike\.exe$'
            & C:\pm\plant.ps1 -Remove
          }
          Write-Host "PowerShell view afterwards:"
          foreach ($id in $a, $b) {
            $found = @(Get-NetFirewallRule -PolicyStore PersistentStore -Name $id -ErrorAction SilentlyContinue).Count
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $id -ErrorAction SilentlyContinue).Count
            Write-Host "$id persistent=$found active=$active"
            if ($id -eq $a -and ($found -ne 0 -or $active -ne 0)) { $code = 1 }
            if ($id -eq $b -and ($found -ne 1 -or $active -ne 1)) { $code = 1 }
          }
          Remove-NetFirewallRule -Name $a, $b -ErrorAction SilentlyContinue
          exit $code
      - name: Host install and fence paths, captured (no plants)
        if: always()
        shell: pwsh
        env:
          CI: 'true'
          ETD_HOST_CI_INSTALL: '1'
        run: |
          Start-Process C:\pm\Procmon64.exe -ArgumentList '/AcceptEula','/Quiet','/Minimized','/BackingFile','C:\pm\host.pml'
          Start-Sleep -Seconds 10
          try {
            cargo nextest run --locked --profile privileged -p etd-host --run-ignored only --test install_roundtrip -E 'test(install_connect_uninstall)' --success-output never --failure-output immediate
            Write-Host "install_connect_uninstall exit under capture: $LASTEXITCODE"
            cargo nextest run --locked --profile privileged -p etd-sysfx-os --run-ignored only --test windows_fence -E 'test(session_fence)' --success-output never --failure-output immediate
            Write-Host "session_fence exit under capture: $LASTEXITCODE"
          } finally {
            & C:\pm\analyze.ps1 -Name host -Processes '^(etd-host|install_roundtrip-[0-9a-f]+|windows_fence-[0-9a-f]+)\.exe$'
          }
          exit 0
      - name: Today's session-form worker under the same plants (evidence, expected to fail)
        if: always()
        shell: pwsh
        run: |
          & C:\pm\plant.ps1
          try {
            cargo nextest run --locked --profile privileged -p etd-sysfx-os --run-ignored only --test windows_fence -E 'test(session_fence)' --success-output never --failure-output immediate
            Write-Host "session_fence exit under plants: $LASTEXITCODE"
          } finally {
            & C:\pm\plant.ps1 -Remove
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: es2n-procmon
          path: |
            C:\pm\*-classes.csv
            C:\pm\*-loads.txt
