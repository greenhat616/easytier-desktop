name: O1 Windows privileged adapters
on:
  push:
    branches: [wbs/O1-windows]
    paths:
      - 'crates/etd-sysfx-os/src/windows/**'
      - 'crates/etd-sysfx-os/tests/windows_*.rs'
      - '.github/workflows/o1-windows.yml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  privileged:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned protoc
        shell: pwsh
        run: ./.github/scripts/setup-protoc.ps1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p etd-sysfx-os --all-targets -- -D warnings
      - run: cargo nextest run --locked -p etd-sysfx-os --lib
      - name: Fetch the S2-pinned upstream core and bundled Wintun
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'o1-core.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'o1-core'
          gh api repos/EasyTier/EasyTier/actions/artifacts/14959009694/zip > $zip
          if ($LASTEXITCODE -ne 0) { throw 'Core download failed' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '7fbabdaa80e37d32add40bd8933056dcb7bd6c7b83c35f01f09fd84da4a167c3') { throw 'Core artifact digest mismatch' }
          Expand-Archive $zip $dir
          $exe = Get-ChildItem $dir -Recurse -Filter easytier-core.exe | Select-Object -First 1
          if (-not $exe) { throw 'Core binary missing' }
          "ETD_O1_CORE=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Reclaim with real objects and same-name conflict
        run: cargo nextest run --locked --profile privileged -p etd-sysfx-os --run-ignored only --test windows_reclaim --success-output immediate
      - name: WFP SYSTEM and second-account test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = [guid]::NewGuid().ToString('N').Substring(0,8)
          $name = "etdo1_$tag"
          $account = "$env:COMPUTERNAME\$name"
          $folder = Join-Path $env:ProgramData "etd-o1-$tag"
          $password = [guid]::NewGuid().ToString('N') + 'Aa!5'
          $job = $null
          try {
            New-LocalUser -Name $name -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
            Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $account -ErrorAction SilentlyContinue
            Start-Service seclogon
            New-Item -ItemType Directory -Path $folder | Out-Null
            New-Item -ItemType Directory -Path "$folder\results" | Out-Null
            & icacls $folder /inheritance:r /grant '*S-1-5-18:(OI)(CI)(F)' '*S-1-5-32-544:(OI)(CI)(F)' "${account}:(OI)(CI)(RX)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Test ACL failed' }
            & icacls "$folder\results" /grant "${account}:(OI)(CI)(M)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Probe result ACL failed' }
            @'
          param($endpoint)
          $ErrorActionPreference = 'Stop'
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $expected = Get-Content "$PSScriptRoot\sid.txt" -Raw
          if ($sid -ne $expected.Trim()) { throw 'Wrong probe identity' }
          $split = $endpoint.LastIndexOf(':')
          $address = [ipaddress]::Parse($endpoint.Substring(0,$split).Trim('[',']'))
          $port = [int]$endpoint.Substring($split+1)
          $client = [Net.Sockets.TcpClient]::new($address.AddressFamily)
          try {
            $client.Connect($address,$port)
            $verdict = 'connected'
          } catch {
            $errorObject = $_.Exception
            while ($errorObject.InnerException) { $errorObject = $errorObject.InnerException }
            if ($errorObject -is [Net.Sockets.SocketException] -and $errorObject.SocketErrorCode -in @('AccessDenied','ConnectionRefused')) { $verdict = 'refused' }
            else { $verdict = "unexpected error: $errorObject" }
          } finally { $client.Dispose() }
          [IO.File]::WriteAllText("$PSScriptRoot\results\verdict.txt",$verdict)
          '@ | Set-Content "$folder\probe.ps1"
            (Get-LocalUser -Name $name).SID.Value | Set-Content "$folder\sid.txt"
            # S1 demonstrated CreateProcessWithLogonW on the hosted runner;
            # scheduled non-admin tasks can fail for missing batch-logon rights.
            # Keep the disposable user's credential in memory in this job.
            $credential = [pscredential]::new($account,(ConvertTo-SecureString $password -AsPlainText -Force))
            $powershell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
            $job = Start-ThreadJob -ArgumentList $folder,$credential,$powershell -ScriptBlock {
              param($folder,$credential,$powershell)
              $ErrorActionPreference='Stop'
              while ($true) {
                try {
                  if (Test-Path "$folder\endpoint.txt") {
                    $endpoint=(Get-Content "$folder\endpoint.txt" -Raw).Trim()
                    Remove-Item -LiteralPath "$folder\endpoint.txt"
                    $arguments='-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}\probe.ps1" {1}' -f $folder,$endpoint
                    $p=Start-Process -FilePath $powershell -ArgumentList $arguments -Credential $credential -WorkingDirectory $folder -WindowStyle Hidden -PassThru
                    if (!$p.WaitForExit(20000)) { $p.Kill(); throw 'Second user process timed out' }
                    if ($p.ExitCode -ne 0) { throw "Second user process exited $($p.ExitCode)" }
                  }
                } catch { [IO.File]::WriteAllText("$folder\results\verdict.txt","probe error: $($_.Exception.Message)") }
                Start-Sleep -Milliseconds 100
              }
            }
            $env:ETD_O1_SECOND_DIR = $folder
            cargo nextest run --locked --profile privileged -p etd-sysfx-os --run-ignored only --test windows_fence --success-output immediate
            if ($LASTEXITCODE -ne 0) { throw 'WFP fence acceptance failed' }
          } finally {
            if ($job) { Stop-Job $job -ErrorAction SilentlyContinue; Receive-Job $job -ErrorAction SilentlyContinue; Remove-Job $job -Force -ErrorAction SilentlyContinue }
            Remove-LocalUser -Name $name -ErrorAction SilentlyContinue
          }
