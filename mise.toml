[tools]
protoc = "36.2"
cargo-nextest = "0.9.152"
cargo-deny = "0.22.1"
buf = "1.75.0"
just = "1.59.0"
python = "3.12.10"

[settings]
python.compile = false
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[env]
PROTOC_INCLUDE = { value = "{% if tools.protoc is defined %}{{ tools.protoc.path }}/include{% endif %}", tools = true }
