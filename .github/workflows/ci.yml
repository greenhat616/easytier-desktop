name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-dri3-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libdbus-1-dev
      - name: Install pinned protoc
        shell: pwsh
        run: ./.github/scripts/setup-protoc.ps1
      - name: Check toolchain
        run: |
          rustc --version
          cargo fmt --version
          cargo clippy --version
          protoc --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace -- -D warnings
      - run: cargo build --locked --workspace
      - name: Install nextest (fallback to cargo test if unavailable)
        uses: taiki-e/install-action@v2
        continue-on-error: true
        with:
          tool: cargo-nextest@0.9.152
      - name: Tests (nextest if available)
        shell: pwsh
        run: |
          cargo nextest --version
          if ($LASTEXITCODE -eq 0) {
            cargo nextest run --locked --workspace
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --workspace --doc
          } else {
            cargo test --locked --workspace
          }
          exit $LASTEXITCODE
      - run: cargo xtask check-boundaries
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.1
      - run: cargo deny --locked check
