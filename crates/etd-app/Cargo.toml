[package]
name = "etd-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# UI-independent: no gpui, no OS bindings, nothing from the host side.
[dependencies]
etd-client = { workspace = true }
etd-contract = { workspace = true }
etd-ipc = { workspace = true }
async-channel = { workspace = true }
async-trait = { workspace = true }
directories = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
jiff = { workspace = true, features = ["std", "serde"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["std", "v4", "serde"] }

[dev-dependencies]
etd-testkit = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
