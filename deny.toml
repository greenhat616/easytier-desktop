# Compatibility policy for the initial LGPL-3.0-or-later workspace.
# New licenses and sources must be inspected rather than silently ignored.
[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "Unicode-DFS-2016", "Unlicense", "CC0-1.0",
    "BSL-1.0", "MPL-2.0", "LGPL-3.0-only", "LGPL-3.0-or-later",
    # Additional license identifiers present in the resolved dependency graph.
    "0BSD", "NCSA", "MIT-0", "CDLA-Permissive-2.0", "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/EasyTier/EasyTier.git"]
