syntax = "proto3";

package etd.v1;

import "etd/v1/options.proto";

// Contract v1 between desktop clients (UI, CLI) and etd-host.
//
// Versioning: the major version must match exactly; minor versions only add.
// Every call carries the metadata entry "etd-contract-version: <major>.<minor>"
// and the host interceptor re-checks it. Clients enable features from the
// capability list in Welcome, never by comparing version numbers.
//
// Errors: a rejected call returns a gRPC status whose details hold an encoded
// ErrorDetail.
//
// Mutations: every state change carries a client-generated request id and the
// revision the client last saw. The host commits the request record, desired
// state, new revision, operation ticket and, when the request starts a new
// generation of an instance, that generation's reserved epoch and planned side
// effects, all in one ledger transaction before it answers. Retrying the same request id with the same content returns the
// original receipt; the same id with different content is rejected; a stale
// expected revision is a conflict. A receipt only means "durably accepted";
// progress is reported on the event stream.
//
// Not in contract 1.0: the user host's "remote" mode (attach to another
// machine's kernel management port without starting a kernel). Adding it later
// is additive (a NetworkSpec alternative plus a capability).
service HostService {
  // Version negotiation. Major mismatch fails with VERSION_MISMATCH.
  rpc Handshake(Hello) returns (Welcome) {
    option (required_role) = ROLE_VIEWER;
  }
  // Full state, including the reclaim report and the event cursor it reflects.
  rpc Snapshot(SnapshotRequest) returns (HostSnapshot) {
    option (required_role) = ROLE_VIEWER;
  }
  // Pushed event stream. Resuming from a cursor delivers every later event
  // exactly once, or ResyncRequired when the cursor cannot be honoured.
  rpc Subscribe(SubscribeRequest) returns (stream Event) {
    option (required_role) = ROLE_VIEWER;
  }
  // Create or replace an instance configuration, optionally changing its
  // desired state in the same transaction.
  rpc Apply(ApplyRequest) returns (ApplyResponse) {
    option (required_role) = ROLE_CONTROL;
  }
  // Change an instance's desired state (running or stopped). Also the
  // "retry confirm" path for an instance shown as CUT_UNCONFIRMED: resend the
  // stop with the same request id. Setting the value the instance already has
  // commits a ticket but changes nothing else; in particular it does not
  // restart a GAVE_UP instance (use RetryStart).
  rpc SetDesired(SetDesiredRequest) returns (SetDesiredResponse) {
    option (required_role) = ROLE_CONTROL;
  }
  // Stop an instance if needed and drop its configuration once its last
  // epoch is closed.
  rpc RemoveInstance(RemoveInstanceRequest) returns (RemoveInstanceResponse) {
    option (required_role) = ROLE_CONTROL;
  }
  // Fetch the receipt of an earlier mutation by request id (lost reply).
  rpc GetReceipt(GetReceiptRequest) returns (GetReceiptResponse) {
    option (required_role) = ROLE_VIEWER;
  }
  // Typed read-only kernel queries. Fails with MANAGEMENT_UNAVAILABLE when
  // the instance has no verified management access.
  rpc Query(QueryRequest) returns (QueryResponse) {
    option (required_role) = ROLE_VIEWER;
  }
  // Host or kernel log lines.
  rpc StreamLogs(StreamLogsRequest) returns (stream LogLine) {
    option (required_role) = ROLE_VIEWER;
  }
  rpc GetReclaimReport(GetReclaimReportRequest) returns (ReclaimReport) {
    option (required_role) = ROLE_VIEWER;
  }
  // Retry cleanup of a quarantined instance.
  rpc RetryReclaim(RetryReclaimRequest) returns (RetryReclaimResponse) {
    option (required_role) = ROLE_CONTROL;
  }
  // Manual retry of an instance in GAVE_UP (desired still running): resets the
  // restart policy's circuit breaker and starts a new generation. Rejected with
  // INSTANCE_BUSY in any other state.
  rpc RetryStart(RetryStartRequest) returns (RetryStartResponse) {
    option (required_role) = ROLE_CONTROL;
  }
  // Item-by-item decision on reclaim candidates and conflicts.
  rpc ResolveCandidates(ResolveCandidatesRequest) returns (ResolveCandidatesResponse) {
    option (required_role) = ROLE_ADMIN;
  }
  // Session-form hosts (elevated session, user host) live while a client
  // holds the lease. A client hands it back on exit and says what happens to
  // the instances. Service hosts accept and ignore the call.
  rpc ReleaseLease(ReleaseLeaseRequest) returns (ReleaseLeaseResponse) {
    option (required_role) = ROLE_CONTROL;
  }
  rpc GetAllowList(GetAllowListRequest) returns (GetAllowListResponse) {
    option (required_role) = ROLE_ADMIN;
  }
  rpc SetAllowList(SetAllowListRequest) returns (SetAllowListResponse) {
    option (required_role) = ROLE_ADMIN;
  }
  // Kernels present in the host's protected kernel store. Clients never pass
  // a kernel path.
  rpc ListCores(ListCoresRequest) returns (ListCoresResponse) {
    option (required_role) = ROLE_VIEWER;
  }
  rpc SelectCore(SelectCoreRequest) returns (SelectCoreResponse) {
    option (required_role) = ROLE_ADMIN;
  }
  // Stop every instance, reclaim, and drop all configuration.
  rpc PurgeAllData(PurgeAllDataRequest) returns (PurgeAllDataResponse) {
    option (required_role) = ROLE_ADMIN;
  }
}

// ---------------------------------------------------------------- handshake

enum ClientKind {
  CLIENT_KIND_UNSPECIFIED = 0;
  CLIENT_KIND_DESKTOP = 1;
  CLIENT_KIND_CLI = 2;
}

message Hello {
  uint32 major = 1;
  uint32 minor = 2;
  // Client build string, informational only.
  string build = 3;
  ClientKind client_kind = 4;
}

enum HostMode {
  HOST_MODE_UNSPECIFIED = 0;
  // Installed system service (SYSTEM / root), full features including TUN.
  HOST_MODE_SERVICE = 1;
  // One-shot elevated session started by the UI.
  HOST_MODE_ELEVATED_SESSION = 2;
  // Child process of the UI running as the current user; no TUN.
  HOST_MODE_USER = 3;
}

enum HostPhase {
  HOST_PHASE_UNSPECIFIED = 0;
  // Startup self-check; control requests are refused with HOST_NOT_SERVING.
  HOST_PHASE_SELF_CHECK = 1;
  HOST_PHASE_SERVING = 2;
  // Ledger cannot be opened or has an unknown schema: diagnose and list
  // candidates only; no instance is started.
  HOST_PHASE_DIAGNOSTIC_ONLY = 3;
  HOST_PHASE_SHUTTING_DOWN = 4;
}

message Welcome {
  uint32 major = 1;
  uint32 minor = 2;
  // Feature names this host supports; see etd_contract::capability.
  repeated string capabilities = 3;
  // The caller's role, derived from its OS credentials.
  Role role = 4;
  string host_build = 5;
  HostMode host_mode = 6;
  HostPhase phase = 7;
  // Identity of this host run's event stream; part of every EventCursor.
  string stream_id = 8;
}

// ----------------------------------------------------------------- mutation

message MutationHeader {
  // Client-generated, unique per logical request; reuse it when retrying.
  string request_id = 1;
  // The revision the client last observed.
  uint64 expected_revision = 2;
}

message Receipt {
  string request_id = 1;
  // Ledger revision after this request.
  uint64 revision = 2;
  // Operation ticket; events caused by this request reference it.
  string ticket = 3;
  int64 accepted_unix_ms = 4;
}

enum Desired {
  DESIRED_UNSPECIFIED = 0;
  DESIRED_STOPPED = 1;
  DESIRED_RUNNING = 2;
}

// ------------------------------------------------------------ configuration

enum TransportProtocol {
  TRANSPORT_PROTOCOL_UNSPECIFIED = 0;
  TRANSPORT_PROTOCOL_TCP = 1;
  TRANSPORT_PROTOCOL_UDP = 2;
}

message PortForward {
  TransportProtocol protocol = 1;
  // Local bind address, "ip:port".
  string bind = 2;
  // Destination inside the virtual network, "ip:port".
  string destination = 3;
}

message NetworkFlags {
  bool latency_first = 1;
  bool disable_encryption = 2;
  bool enable_kcp_proxy = 3;
  bool enable_quic_proxy = 4;
  bool disable_p2p = 5;
  bool disable_udp_hole_punching = 6;
  bool relay_all_peer_rpc = 7;
  bool multi_thread = 8;
  bool private_mode = 9;
  bool disable_ipv6 = 10;
  bool use_smoltcp = 11;
  bool bind_device = 12;
  // Kernel compression algorithm name; empty = kernel default.
  string compression = 13;
}

// Typed network parameters. The host generates the kernel configuration from
// these; the interface name, management port and kernel path are always
// chosen by the host and cannot be set here.
message NetworkSpec {
  // UI label only; never passed to the kernel.
  string display_name = 1;
  string network_name = 2;
  // Write-only. On Apply, absent keeps the stored secret and "" clears it.
  // The host never returns it: snapshots and events leave it absent and set
  // network_secret_set instead.
  optional string network_secret = 3;
  // Output only.
  bool network_secret_set = 4;
  string hostname = 5;
  oneof ipv4 {
    // Static virtual address, "a.b.c.d/len".
    string ipv4_cidr = 6;
    bool dhcp = 7;
  }
  // Peer URIs, e.g. "tcp://host:11010".
  repeated string peers = 8;
  // Listener URIs; empty = kernel defaults unless no_listener is set.
  repeated string listeners = 9;
  bool no_listener = 10;
  // Subnets this node proxies into the virtual network.
  repeated string proxy_cidrs = 11;
  repeated string exit_nodes = 12;
  bool enable_exit_node = 13;
  // 0 = kernel default.
  uint32 mtu = 14;
  // Run without a TUN interface (socks5 / port forwarding only).
  bool no_tun = 15;
  // 0 = disabled.
  uint32 socks5_port = 16;
  repeated PortForward port_forwards = 17;
  // Magic DNS system integration. Single writer on Windows; rejected on
  // macOS under a privileged host in the first release.
  bool magic_dns = 18;
  // Linux public IPv6 provider. Rejected under a privileged host until its
  // side effects are modelled.
  bool public_ipv6_provider = 19;
  NetworkFlags flags = 20;
}

message DesiredInstance {
  // Client-generated instance id.
  string instance_id = 1;
  NetworkSpec spec = 2;
  Desired desired = 3;
}

// ------------------------------------------------------------------- status

// Actual instance state; mirrors the instance state machine of the
// architecture baseline.
enum InstanceState {
  INSTANCE_STATE_UNSPECIFIED = 0;
  // Stop intent is durably recorded and the last epoch is closed.
  INSTANCE_STATE_STOPPED = 1;
  // Fence, spawn, enumeration.
  INSTANCE_STATE_STARTING = 2;
  // Published as running: process alive long enough and the expected
  // interface (or listener) observed. Management RPC not (yet) available.
  INSTANCE_STATE_READY_BASIC = 3;
  // Management RPC available and node information read back.
  INSTANCE_STATE_READY_FULL = 4;
  // Graceful stop, then tree kill on timeout.
  INSTANCE_STATE_STOPPING = 5;
  // Probe, delete, verify. Every process exit passes through here.
  INSTANCE_STATE_RECLAIMING = 6;
  // Waiting for the restart policy's delay.
  INSTANCE_STATE_BACKOFF = 7;
  // Circuit breaker: fifth abnormal exit within five minutes. Desired state
  // is still running; RetryStart restarts.
  INSTANCE_STATE_GAVE_UP = 8;
  // Reclaim failed five times, a candidate awaits confirmation, or process
  // liveness is uncertain. The epoch stays open; no new epoch starts.
  INSTANCE_STATE_QUARANTINED = 9;
  // The kernel was killed but the stop intent could not be persisted; the
  // instance may come back after a host restart. Retry with SetDesired.
  INSTANCE_STATE_CUT_UNCONFIRMED = 10;
}

enum ManagementAccess {
  MANAGEMENT_ACCESS_UNSPECIFIED = 0;
  // Fence not yet verified.
  MANAGEMENT_ACCESS_PENDING = 1;
  // Fence verified in both directions (or unprivileged user host).
  MANAGEMENT_ACCESS_AVAILABLE = 2;
  // Port closed to everyone by a verified deny-all kernel configuration:
  // lifecycle, logs and reclaim only.
  MANAGEMENT_ACCESS_DENY_ALL = 3;
  // Kernel version without adapter profile under a user host: lifecycle and
  // logs only, no RPC at all.
  MANAGEMENT_ACCESS_LIFECYCLE_ONLY = 4;
}

message ExitInfo {
  optional int32 code = 1;
  optional int32 signal = 2;
  // Not requested by the host.
  bool abnormal = 3;
  int64 at_unix_ms = 4;
}

message InstanceStatus {
  string instance_id = 1;
  InstanceState state = 2;
  // Current or last epoch (generation) of the instance.
  uint64 epoch = 3;
  ManagementAccess management = 4;
  // Abnormal exits counted by the restart policy's window.
  uint32 restart_attempt = 5;
  // Set while in BACKOFF.
  int64 next_restart_unix_ms = 6;
  ExitInfo last_exit = 7;
  // Human-readable detail for the current state.
  string message = 8;
  // Observed interface name (macOS: assigned by the system, read back).
  string interface_name = 9;
  repeated string addresses = 10;
  string core_version = 11;
  int64 state_since_unix_ms = 12;
  // Residues and candidates keeping the current epoch open.
  uint32 open_residues = 13;
}

message InstanceView {
  // Secret redacted.
  DesiredInstance desired = 1;
  InstanceStatus status = 2;
}

message EventCursor {
  string stream_id = 1;
  uint64 seq = 2;
}

message SnapshotRequest {}

message HostSnapshot {
  uint64 revision = 1;
  repeated InstanceView instances = 2;
  // Events after this cursor are not reflected in the snapshot.
  EventCursor cursor = 3;
  HostPhase phase = 4;
  ReclaimReport reclaim = 5;
  string default_core_version = 6;
}

// ------------------------------------------------------------------- events

message SubscribeRequest {
  // Absent: start with events after subscription.
  EventCursor after = 1;
}

message DesiredChanged {
  uint64 revision = 1;
  // Secret redacted.
  DesiredInstance instance = 2;
  string request_id = 3;
  string ticket = 4;
}

message InstanceRemoved {
  string instance_id = 1;
  uint64 revision = 2;
}

message InstanceExited {
  string instance_id = 1;
  uint64 epoch = 2;
  ExitInfo exit = 3;
  // Abnormal exits in the restart window, this one included.
  uint32 attempt = 4;
  // 0 when no restart is scheduled.
  int64 restart_at_unix_ms = 5;
  bool gave_up = 6;
}

message HostPhaseChanged {
  HostPhase phase = 1;
}

message ResyncRequired {
  string reason = 1;
}

enum NoticeLevel {
  NOTICE_LEVEL_UNSPECIFIED = 0;
  NOTICE_LEVEL_INFO = 1;
  NOTICE_LEVEL_WARNING = 2;
  NOTICE_LEVEL_ERROR = 3;
}

message Notice {
  NoticeLevel level = 1;
  // Stable machine-readable code.
  string code = 2;
  string message = 3;
  string instance_id = 4;
}

message Event {
  EventCursor cursor = 1;
  int64 at_unix_ms = 2;
  oneof payload {
    InstanceStatus instance_status = 10;
    InstanceRemoved instance_removed = 11;
    DesiredChanged desired_changed = 12;
    ReclaimReport reclaim_report = 13;
    HostPhaseChanged host_phase = 14;
    InstanceExited instance_exited = 15;
    // The client must take a new snapshot and resubscribe from its cursor.
    ResyncRequired resync_required = 16;
    Notice notice = 17;
  }
}

// ------------------------------------------------------- mutation requests

message ApplyRequest {
  MutationHeader header = 1;
  string instance_id = 2;
  NetworkSpec spec = 3;
  // UNSPECIFIED keeps the current desired state; a new instance starts as
  // STOPPED unless set here.
  Desired desired = 4;
}

message ApplyResponse {
  Receipt receipt = 1;
}

message SetDesiredRequest {
  MutationHeader header = 1;
  string instance_id = 2;
  Desired desired = 3;
}

message SetDesiredResponse {
  Receipt receipt = 1;
}

message RemoveInstanceRequest {
  MutationHeader header = 1;
  string instance_id = 2;
}

message RemoveInstanceResponse {
  Receipt receipt = 1;
}

message GetReceiptRequest {
  string request_id = 1;
}

message GetReceiptResponse {
  // Absent when the host has no record of the request id.
  Receipt receipt = 1;
}

// ------------------------------------------------------------------ queries

enum QueryKind {
  QUERY_KIND_UNSPECIFIED = 0;
  QUERY_KIND_NODES = 1;
  QUERY_KIND_ROUTES = 2;
  QUERY_KIND_TRAFFIC = 3;
}

message QueryRequest {
  string instance_id = 1;
  QueryKind kind = 2;
}

message Node {
  uint32 peer_id = 1;
  string hostname = 2;
  string ipv4_cidr = 3;
  string version = 4;
  uint32 latency_us = 5;
  double loss_rate = 6;
  string nat_type = 7;
  // Tunnel protocols in use, e.g. "tcp", "udp", "quic".
  repeated string tunnels = 8;
  uint32 cost = 9;
  bool is_self = 10;
  uint64 rx_bytes = 11;
  uint64 tx_bytes = 12;
  string ipv6_cidr = 13;
}

message NodeList {
  repeated Node nodes = 1;
}

message Route {
  uint32 peer_id = 1;
  string hostname = 2;
  string ipv4_cidr = 3;
  repeated string proxy_cidrs = 4;
  uint32 next_hop_peer_id = 5;
  uint32 cost = 6;
  uint32 path_latency_us = 7;
}

message RouteList {
  repeated Route routes = 1;
}

message PeerTraffic {
  uint32 peer_id = 1;
  uint64 rx_bytes = 2;
  uint64 tx_bytes = 3;
}

message TrafficStats {
  uint64 rx_bytes = 1;
  uint64 tx_bytes = 2;
  uint64 rx_packets = 3;
  uint64 tx_packets = 4;
  repeated PeerTraffic peers = 5;
}

message QueryResponse {
  oneof result {
    NodeList nodes = 1;
    RouteList routes = 2;
    TrafficStats traffic = 3;
  }
  int64 at_unix_ms = 4;
}

// --------------------------------------------------------------------- logs

enum LogSource {
  LOG_SOURCE_UNSPECIFIED = 0;
  LOG_SOURCE_HOST = 1;
  LOG_SOURCE_CORE_STDOUT = 2;
  LOG_SOURCE_CORE_STDERR = 3;
}

message StreamLogsRequest {
  // Empty: the host's own log.
  string instance_id = 1;
  // Number of past lines to send first.
  uint32 tail_lines = 2;
  // Keep the stream open for new lines.
  bool follow = 3;
}

message LogLine {
  int64 at_unix_ms = 1;
  LogSource source = 2;
  string text = 3;
  string instance_id = 4;
  uint64 epoch = 5;
}

// ------------------------------------------------------------------ reclaim

enum ReclaimStatus {
  RECLAIM_STATUS_UNSPECIFIED = 0;
  RECLAIM_STATUS_CLEAN = 1;
  RECLAIM_STATUS_IN_PROGRESS = 2;
  // Five consecutive failures or uncertain process liveness.
  RECLAIM_STATUS_QUARANTINED = 3;
  // Candidates await item-by-item confirmation.
  RECLAIM_STATUS_AWAITING_CONFIRMATION = 4;
}

enum ResidueState {
  RESIDUE_STATE_UNSPECIFIED = 0;
  RESIDUE_STATE_PENDING = 1;
  RESIDUE_STATE_FAILING = 2;
  RESIDUE_STATE_INDETERMINATE = 3;
}

// A ledger record of a still-open epoch.
message Residue {
  string effect_id = 1;
  // Stable effect kind name, e.g. "win.firewall_rule".
  string kind = 2;
  // Natural key, human-readable.
  string identity = 3;
  uint32 failures = 4;
  string last_error = 5;
  ResidueState state = 6;
}

message InstanceReclaim {
  string instance_id = 1;
  uint64 epoch = 2;
  ReclaimStatus status = 3;
  repeated Residue residues = 4;
  string reason = 5;
}

enum CandidateOrigin {
  CANDIDATE_ORIGIN_UNSPECIFIED = 0;
  // Ledger record still "planned": the object exists but its creation
  // credential was never read back, and it is not in an exclusive container.
  CANDIDATE_ORIGIN_NO_CREDENTIAL = 1;
  // Name re-derived from the repair index after the ledger was lost.
  CANDIDATE_ORIGIN_LEDGER_LOST = 2;
  // Only the product prefix matches.
  CANDIDATE_ORIGIN_PREFIX_MATCH = 3;
}

// An object that may be ours but is never deleted automatically.
message Candidate {
  string candidate_id = 1;
  string kind = 2;
  string identity = 3;
  CandidateOrigin origin = 4;
  string instance_id = 5;
  uint64 epoch = 6;
  string detail = 7;
}

// Same name as one of our objects, but a different identity. Never deleted.
// The record stays open (the generation stays quarantined) so that the next
// generation does not reuse the clashing name, until an administrator
// releases it with CANDIDATE_ACTION_KEEP on conflict_id.
message Conflict {
  string kind = 1;
  string identity = 2;
  string expected = 3;
  string found = 4;
  string effect_id = 5;
  // Accepted in CandidateDecision.candidate_id (KEEP only).
  string conflict_id = 6;
}

message GetReclaimReportRequest {}

message ReclaimReport {
  int64 generated_unix_ms = 1;
  repeated InstanceReclaim instances = 2;
  repeated Candidate candidates = 3;
  repeated Conflict conflicts = 4;
  // E.g. Magic DNS left in place because another EasyTier process runs.
  repeated Notice notes = 5;
}

message RetryReclaimRequest {
  MutationHeader header = 1;
  string instance_id = 2;
}

message RetryReclaimResponse {
  Receipt receipt = 1;
}

message RetryStartRequest {
  MutationHeader header = 1;
  string instance_id = 2;
}

message RetryStartResponse {
  Receipt receipt = 1;
}

enum CandidateAction {
  CANDIDATE_ACTION_UNSPECIFIED = 0;
  // Ours: delete it.
  CANDIDATE_ACTION_DELETE = 1;
  // Not ours: leave it and release the record.
  CANDIDATE_ACTION_KEEP = 2;
}

message CandidateDecision {
  // Candidate.candidate_id, or Conflict.conflict_id (KEEP only).
  string candidate_id = 1;
  CandidateAction action = 2;
}

message ResolveCandidatesRequest {
  MutationHeader header = 1;
  repeated CandidateDecision decisions = 2;
}

message ResolveCandidatesResponse {
  Receipt receipt = 1;
}

// -------------------------------------------------------------------- lease

enum LeaseRelease {
  LEASE_RELEASE_UNSPECIFIED = 0;
  // Default policy: gracefully stop every instance, then exit.
  LEASE_RELEASE_STOP_INSTANCES = 1;
  LEASE_RELEASE_KEEP_INSTANCES = 2;
}

message ReleaseLeaseRequest {
  LeaseRelease instances = 1;
}

message ReleaseLeaseResponse {
  // The host will exit after this call (session forms).
  bool host_exiting = 1;
}

// -------------------------------------------------------------------- admin

message OsPrincipal {
  oneof id {
    string windows_user_sid = 1;
    string windows_group_sid = 2;
    uint32 unix_uid = 3;
    uint32 unix_gid = 4;
  }
}

message AllowEntry {
  OsPrincipal principal = 1;
  Role role = 2;
  string display_name = 3;
}

message GetAllowListRequest {}

message GetAllowListResponse {
  repeated AllowEntry entries = 1;
  uint64 revision = 2;
}

message SetAllowListRequest {
  MutationHeader header = 1;
  repeated AllowEntry entries = 2;
}

message SetAllowListResponse {
  Receipt receipt = 1;
}

enum CoreSupport {
  CORE_SUPPORT_UNSPECIFIED = 0;
  // Adapter profile available: full features.
  CORE_SUPPORT_PROFILED = 1;
  // No profile: user host may run it lifecycle-only; privileged hosts refuse.
  CORE_SUPPORT_LIFECYCLE_ONLY = 2;
  // Manifest or hash check failed.
  CORE_SUPPORT_REJECTED = 3;
}

message CoreEntry {
  string version = 1;
  string proto_revision = 2;
  // Lower-case hex SHA-256 of the binary, from the store manifest.
  string sha256 = 3;
  CoreSupport support = 4;
}

message ListCoresRequest {}

message ListCoresResponse {
  repeated CoreEntry cores = 1;
  string default_version = 2;
}

message SelectCoreRequest {
  MutationHeader header = 1;
  // A version present in the store; applies to epochs started afterwards.
  string version = 2;
}

message SelectCoreResponse {
  Receipt receipt = 1;
}

message PurgeAllDataRequest {
  MutationHeader header = 1;
  // Must be true.
  bool confirm = 2;
}

message PurgeAllDataResponse {
  Receipt receipt = 1;
}

// ------------------------------------------------------------------- errors

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // Major version differs; the client must upgrade the service.
  ERROR_CODE_VERSION_MISMATCH = 1;
  // Missing or malformed etd-contract-version metadata.
  ERROR_CODE_VERSION_METADATA = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  // Administration needs an elevated token.
  ERROR_CODE_ELEVATION_REQUIRED = 4;
  // expected_revision is stale; current_revision holds the actual one.
  ERROR_CODE_REVISION_CONFLICT = 5;
  // Same request id, different content.
  ERROR_CODE_REQUEST_ID_REUSED = 6;
  ERROR_CODE_UNKNOWN_INSTANCE = 7;
  ERROR_CODE_INVALID_SPEC = 8;
  // A configured feature is disabled or rejected on this platform/host form.
  ERROR_CODE_FEATURE_REJECTED = 9;
  // The configuration has side effects the adapter profile cannot predict.
  ERROR_CODE_UNMODELLED_EFFECTS = 10;
  // A single-writer feature (Windows Magic DNS) is held by another instance.
  ERROR_CODE_SINGLE_WRITER_TAKEN = 11;
  // No usable kernel: missing, hash mismatch, or no profile on a privileged
  // host.
  ERROR_CODE_CORE_UNAVAILABLE = 12;
  // Ledger cannot be written (disk full, locked, corrupt).
  ERROR_CODE_LEDGER_UNAVAILABLE = 13;
  // Instance must be stopped and reclaimed first, or is quarantined.
  ERROR_CODE_INSTANCE_BUSY = 14;
  // Self-check, diagnostic-only or shutting down.
  ERROR_CODE_HOST_NOT_SERVING = 15;
  ERROR_CODE_MANAGEMENT_UNAVAILABLE = 16;
  ERROR_CODE_UNKNOWN_CANDIDATE = 17;
}

// Carried in the gRPC status details of every rejected call.
message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  // Set with REVISION_CONFLICT.
  uint64 current_revision = 3;
  // Set with FEATURE_REJECTED / UNMODELLED_EFFECTS / SINGLE_WRITER_TAKEN.
  repeated string features = 4;
  string instance_id = 5;
  // Set with VERSION_MISMATCH.
  uint32 host_major = 6;
  uint32 host_minor = 7;
}
