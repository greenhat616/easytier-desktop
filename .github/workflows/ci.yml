name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push replaces a branch's running checks. Every commit on main is
# checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Debug information costs link time and cache space, above all on Windows.
  # Panic messages keep their file and line without it.
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  # Platform-independent, and quick enough to fail first: `cargo metadata`
  # covers every target from one host.
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cargo fmt --all -- --check
      - run: cargo xtask check-boundaries
  # The contract rules of buf.yaml. `buf breaking` compares with the
  # freeze-v1 tag and with where this change starts (main's previous commit
  # on main, the merge base with main elsewhere). The second comparison uses
  # buf.yaml's module and rules without its ignore_only, which exists only
  # for the freeze-v1 baseline: keep the two in step.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
        with:
          tools: buf
      - run: buf lint
      - run: buf breaking --against '.git#tag=freeze-v1'
      - name: buf breaking against the start of the change
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            base=$(git rev-parse HEAD^1)
          else
            base=$(git merge-base origin/main HEAD)
          fi
          config='{"version":"v2","modules":[{"path":"crates/etd-contract/proto"}],"breaking":{"use":["FILE"]}}'
          buf breaking --config "$config" --against ".git#ref=$base"
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-dri3-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libdbus-1-dev
      - uses: ./.github/actions/setup-tools
        with:
          tools: protoc cargo-nextest
      - name: Check toolchain
        run: |
          rustc --version
          cargo fmt --version
          cargo clippy --version
          protoc --version
      # Only main writes caches: branches restore them, and one cache per
      # branch would evict them from the repository's quota.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Without dev-dependencies, so this also catches a feature that only
      # tests enable. There is no separate `cargo build` step: the test step
      # compiles and links the workspace.
      - run: cargo clippy --locked --workspace -- -D warnings
      - name: Tests
        env:
          ETD_IPC_CI_ACCOUNTS: ${{ runner.os == 'Windows' && '1' || '' }}
        run: cargo nextest run --locked --workspace --profile ci
      # The bundled upstream release kernel (packaging/cores.toml), verified
      # against crates/etd-host/cores.lock, drives E2's real-kernel session.
      - name: Fetch the release kernel
        run: cargo xtask fetch-cores --target host --bundle "${{ runner.temp }}/etd-cores" --github-env ETD_EASYTIER_CORE
      - name: Real-kernel session
        run: cargo nextest run --locked --profile ci -p etd-core-easytier --test session_real --run-ignored only --success-output immediate
      - name: Doc tests
        run: cargo test --locked --workspace --doc
  privileged-install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CI: 'true'
      ETD_HOST_CI_INSTALL: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/install-ubuntu-packages.sh build-essential clang cmake pkg-config libssl-dev libdbus-1-dev
      - uses: ./.github/actions/setup-tools
        with:
          tools: protoc cargo-nextest
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `etd-host install` imports cores/<version> beside its image, here
      # the test build's, as listed in crates/etd-host/cores.lock.
      - name: Fetch the release kernel beside the host image
        run: cargo xtask fetch-cores --target host --bundle target/debug/cores
      - name: Install roundtrip on Windows (administrator runner)
        if: runner.os == 'Windows'
        run: cargo nextest run --locked --profile privileged -p etd-host --run-ignored only --test install_roundtrip --success-output immediate
      - name: Elevated session pipe on Windows (administrator runner)
        if: runner.os == 'Windows'
        env:
          ETD_IPC_CI_ACCOUNTS: '1'
        run: cargo nextest run --locked --profile privileged -p etd-ipc --run-ignored only --test session_pipe_acl --test session_clients --test session_server_verify --no-fail-fast --success-output immediate
      - name: Elevated session fence on Windows (administrator runner)
        if: runner.os == 'Windows'
        run: cargo nextest run --locked --profile privileged -p etd-sysfx-os --run-ignored only --test windows_fence -E 'test(session_fence)' --no-fail-fast --success-output immediate
      # After the install roundtrip: the service is gone, so the elevated
      # session host may run (it shares the service's locks).
      - name: Elevated session token check on Windows (administrator runner)
        if: runner.os == 'Windows'
        run: cargo nextest run --locked --profile privileged -p etd-sysfx-os --lib --run-ignored only -E 'test(a_restricted_medium_copy_of_the_admin_token_is_refused)' --success-output immediate
      - name: Elevated session host on Windows (administrator runner)
        if: runner.os == 'Windows'
        run: cargo nextest run --locked --profile privileged -p etd-host --run-ignored only --test session_e2e --success-output immediate
      - name: Install roundtrip on Unix (root on disposable runner)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo nextest list --locked --profile privileged -p etd-host --run-ignored only --test install_roundtrip
          sudo -E env "PATH=$PATH" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CI=true" "ETD_HOST_CI_INSTALL=1" "$(command -v cargo)" nextest run --locked --profile privileged -p etd-host --run-ignored only --test install_roundtrip --success-output immediate
      # Root-owned service sockets (etd-ipc) and tier 2's service-form host,
      # after the roundtrip has removed the installed service. Windows has no
      # step: tier 2's service case needs LocalSystem, not the runner's
      # administrator, and etd-ipc's Windows account case runs in `check`.
      - name: Service IPC and service-form host on Unix (root on disposable runner)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # macOS: /private/var/run is group-writable, so the service listener
          # refuses directories below it. unix_service's macOS case binds there
          # and is not run; the tier 2 service host uses /private/var/db.
          ipc_tests="--test unix_service --test stale_endpoint"
          runtime=/run/etd-g1
          if [ "$RUNNER_OS" = macOS ]; then ipc_tests="--test stale_endpoint"; runtime=/private/var/db/etd-g1; fi
          cargo nextest list --locked --profile privileged -p etd-ipc --run-ignored only $ipc_tests
          cargo nextest list --locked --profile privileged -p etd-testkit --run-ignored only --test tier2
          sudo install -d -m 0700 -o root "$runtime"
          as_root() { sudo -E env "PATH=$PATH" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CI=true" "ETD_G1_SERVICE_RUNTIME=$runtime" "$(command -v cargo)" "$@"; }
          as_root nextest run --locked --profile privileged -p etd-ipc --run-ignored only $ipc_tests --success-output immediate
          as_root nextest run --locked --profile privileged -p etd-testkit --run-ignored only --test tier2 --success-output immediate
      # The cache is saved as the runner user, which cannot manage root's files.
      - name: Return build files to the runner user
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          for directory in target "${CARGO_HOME:-$HOME/.cargo}"; do
            if [ -e "$directory" ]; then sudo chown -R "$(id -u):$(id -g)" "$directory"; fi
          done
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-tools
        with:
          tools: cargo-deny
      - run: cargo deny --locked check
