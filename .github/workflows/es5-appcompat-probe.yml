# ES5 investigation (topic#51 msg#2039, msg#2183): does an empty
# __COMPAT_LAYER in a child's environment override a compatibility layer the
# user wrote for that executable under HKCU AppCompatFlags\Layers? The shim
# DLLs (Ac*.dll) loaded into the child show whether a layer applied.
# Temporary: removed before ES5 is delivered.
name: ES5 AppCompat probe
on:
  push:
    branches: [wbs/ES5-accept]
    paths: ['.github/workflows/es5-appcompat-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Layer applied with and without __COMPAT_LAYER in the child environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'probe'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = Join-Path $dir 'probe.exe'
          Copy-Item "$env:SystemRoot\System32\PING.EXE" $exe
          $layers = 'HKCU:\Software\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers'
          function Probe([string]$label, $value, [switch]$Set) {
            $psi = [Diagnostics.ProcessStartInfo]::new($exe, '-n 20 127.0.0.1')
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            [void]$psi.Environment.Remove('__COMPAT_LAYER')
            if ($Set) { $psi.Environment['__COMPAT_LAYER'] = $value }
            $p = [Diagnostics.Process]::Start($psi)
            Start-Sleep -Seconds 3
            $p.Refresh()
            $shims = @($p.Modules | ForEach-Object ModuleName | Where-Object { $_ -match '^Ac[A-Za-z]+\.dll$' })
            $p.Kill(); $p.WaitForExit()
            $shown = if ($Set) { "'$value'" } else { '(unset)' }
            Write-Host ("{0,-28} __COMPAT_LAYER={1,-16} shim DLLs: {2}" -f $label, $shown, ($(if ($shims) { $shims -join ',' } else { 'none' })))
          }
          Probe 'no layer' $null
          New-Item $layers -Force | Out-Null
          foreach ($layer in '~ WIN7RTM', 'WIN7RTM', '~ WINXPSP3') {
            Set-ItemProperty $layers -Name $exe -Value $layer
            Write-Host "--- HKCU layer: $layer"
            Probe 'layer' $null
            Probe 'layer' '' -Set
            Probe 'layer' ' ' -Set
            Probe 'layer' 'RunAsInvoker' -Set
          }
          Remove-ItemProperty $layers -Name $exe
